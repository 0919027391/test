<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>數獨挑戰｜簡單模式</title>
<style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#243247;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;padding:20px}.app{max-width:540px;margin:auto;background:white;border-radius:18px;padding:22px;box-shadow:0 8px 30px #24324712}h1{margin:0 0 6px;text-align:center}p{text-align:center;color:#64748b}.status{display:flex;justify-content:space-between;margin:18px 0;font-weight:600}.board{display:grid;grid-template-columns:repeat(9,1fr);border:3px solid #263b5c;aspect-ratio:1}.cell{min-width:0;border:0;border-right:1px solid #cbd5e1;border-bottom:1px solid #cbd5e1;background:white;font-size:clamp(16px,4vw,26px);color:#2563eb;cursor:pointer}.cell:nth-child(3n){border-right:2px solid #263b5c}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #263b5c}.cell.given{background:#edf2f8;color:#23344c;font-weight:700}.cell.selected{background:#cfe4ff}.cell.wrong{background:#fee2e2;color:#b91c1c}.numbers{display:grid;grid-template-columns:repeat(10,1fr);gap:5px;margin:16px 0}.numbers button,.actions button{border:0;border-radius:8px;padding:12px 0;background:#e9eff8;color:#23344c;font-weight:700;cursor:pointer}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.actions button{background:#315b9a;color:white;padding:12px}.actions button:disabled{opacity:.5;cursor:wait}#message{min-height:24px;font-size:14px}button:focus-visible{outline:3px solid #f59e0b;outline-offset:-3px}@media(max-width:430px){body{padding:8px}.app{padding:12px}.numbers button{padding:10px 0}}
</style>
</head>
<body><main class="app"><h1>數獨挑戰</h1><p>簡單模式 · 每題保證唯一解</p><div class="status"><span id="clues">題目準備中…</span><span id="clock">00:00</span></div><div class="board" id="board" aria-label="數獨棋盤"></div><div class="numbers" id="numbers"></div><div class="actions"><button id="check">檢查答案</button><button id="hint">提示一格</button><button id="reset">清除作答</button><button id="new">新遊戲</button></div><p id="message" role="status">正在產生唯一解題目…</p></main>
<script>
'use strict';
const base=[[0,1,2,3,4,5,6,7,8],[3,4,5,6,7,8,0,1,2],[6,7,8,0,1,2,3,4,5],[1,2,0,4,5,3,7,8,6],[4,5,3,7,8,6,1,2,0],[7,8,6,1,2,0,4,5,3],[2,0,1,5,3,4,8,6,7],[5,3,4,8,6,7,2,0,1],[8,6,7,2,0,1,5,3,4]];
const $=id=>document.getElementById(id), shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const clone=b=>b.map(r=>r.slice());let solution=[],puzzle=[],entries=[],selected=-1,seconds=0,timer=null,busy=false;
function makeSolution(){const digits=shuffle([1,2,3,4,5,6,7,8,9]);const bands=shuffle([0,1,2]),stacks=shuffle([0,1,2]);const rows=bands.flatMap(b=>shuffle([0,1,2]).map(k=>b*3+k));const cols=stacks.flatMap(b=>shuffle([0,1,2]).map(k=>b*3+k));return rows.map(r=>cols.map(c=>digits[base[r][c]]))}
function countSolutions(board,limit=2){let count=0;function dfs(){if(count>=limit)return;let best=null,choices=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!board[r][c]){let used=new Set([...board[r],...board.map(row=>row[c])]);let br=Math.floor(r/3)*3,bc=Math.floor(c/3)*3;for(let i=br;i<br+3;i++)for(let j=bc;j<bc+3;j++)used.add(board[i][j]);let opts=[];for(let n=1;n<=9;n++)if(!used.has(n))opts.push(n);if(opts.length===0)return;if(best===null||opts.length<choices.length){best=[r,c];choices=opts;if(opts.length===1)break}}if(best===null){count++;return}const [r,c]=best;for(const n of choices){board[r][c]=n;dfs();board[r][c]=0;if(count>=limit)return}}dfs();return count}
function generate(){solution=makeSolution();puzzle=clone(solution);let positions=shuffle(Array.from({length:81},(_,i)=>i)),removed=0;for(const pos of positions){if(removed>=38)break;let r=Math.floor(pos/9),c=pos%9,old=puzzle[r][c];puzzle[r][c]=0;if(countSolutions(puzzle,2)!==1)puzzle[r][c]=old;else removed++}return 81-removed}
function render(wrong=false){const board=$('board');board.replaceChildren();for(let i=0;i<81;i++){const r=Math.floor(i/9),c=i%9,button=document.createElement('button');button.type='button';button.className='cell'+(puzzle[r][c]?' given':'')+(selected===i?' selected':'')+(wrong&&entries[r][c]&&entries[r][c]!==solution[r][c]?' wrong':'');button.textContent=entries[r][c]||'';button.setAttribute('aria-label',`第${r+1}行第${c+1}列${entries[r][c]||'空白'}`);button.addEventListener('click',()=>{selected=i;render()});board.appendChild(button)}}
function put(n){if(busy||selected<0)return;let r=Math.floor(selected/9),c=selected%9;if(puzzle[r][c])return;entries[r][c]=n;render();if(entries.every((row,r)=>row.every((v,c)=>v===solution[r][c]))){clearInterval(timer);$('message').textContent='恭喜！你完成這道唯一解數獨了！'}}
function tick() {seconds++;$('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}
function start(){busy=true;$('new').disabled=true;$('message').textContent='正在產生並驗證唯一解…';clearInterval(timer);setTimeout(()=>{try{const clues=generate();if(countSolutions(clone(puzzle),2)!==1)throw Error('驗證失敗');entries=clone(puzzle);selected=-1;seconds=0;$('clock').textContent='00:00';$('clues').textContent=`已知數字：${clues} / 81`;$('message').textContent='請選擇空格，再點選下方數字。';render();timer=setInterval(tick,1000)}catch(e){$('message').textContent='產生失敗，請按「新遊戲」重試。';console.error(e)}finally{busy=false;$('new').disabled=false}},20)}
for(let n=1;n<=9;n++){const b=document.createElement('button');b.textContent=n;b.addEventListener('click',()=>put(n));$('numbers').appendChild(b)}const erase=document.createElement('button');erase.textContent='⌫';erase.setAttribute('aria-label','清除格子');erase.addEventListener('click',()=>put(0));$('numbers').appendChild(erase);
$('check').addEventListener('click',()=>{if(busy)return;let wrong=0,empty=0;for(let r=0;r<9;r++)for(let c=0;c<9;c++){if(!entries[r][c])empty++;else if(entries[r][c]!==solution[r][c])wrong++}render(true);$('message').textContent=wrong?`有 ${wrong} 格不正確，紅色格子需要修改。`:empty?`目前沒有錯誤，還剩 ${empty} 格。`:'全部正確，恭喜完成！';if(!wrong&&!empty)clearInterval(timer)});
$('hint').addEventListener('click',()=>{if(busy)return;const candidates=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)if(!puzzle[r][c]&&entries[r][c]!==solution[r][c])candidates.push([r,c]);if(!candidates.length){$('message').textContent='沒有需要提示的格子。';return}const [r,c]=candidates[Math.floor(Math.random()*candidates.length)];entries[r][c]=solution[r][c];selected=r*9+c;render();$('message').textContent=`提示：第 ${r+1} 行、第 ${c+1} 列是 ${solution[r][c]}。`;if(entries.every((row,i)=>row.every((v,j)=>v===solution[i][j]))){clearInterval(timer);$('message').textContent='數獨已完成！'}});
$('reset').addEventListener('click',()=>{if(busy)return;entries=clone(puzzle);selected=-1;render();$('message').textContent='已清除作答。'});$('new').addEventListener('click',start);
document.addEventListener('keydown',e=>{if(/^[1-9]$/.test(e.key))put(Number(e.key));else if(e.key==='Backspace'||e.key==='Delete'||e.key==='0')put(0)});start();
</script></body></html>
